
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guardiões do Cuidado - CEIAB</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive;
      background: #e0f7fa;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    .container {
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      margin: 20px auto;
      padding: 20px;
      max-width: 700px;
      border-radius: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      position: relative;
    }
    .top-logo {
      width: 100%;
      max-width: 400px;
      margin-bottom: 20px;
    }
    .question-image {
      width: 200px;
      height: auto;
      margin-bottom: 15px;
      border-radius: 12px;
    }
    button {
      padding: 12px 20px;
      margin: 10px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
    }
    button:hover {
      background-color: #45a049;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <audio id="narracao" src="https://cdn.pixabay.com/audio/2022/03/15/audio_bf5b8a5a69.mp3"></audio>

  <div class="container">
    <div class="card" id="start-screen">
      <img src="CEIAB_image.png" alt="CEIAB Logo" class="top-logo">
      <h1>Guardiões do Cuidado</h1>
      <p>Vamos aprender a usar a internet com segurança!</p>
      <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt="Personagem" class="question-image">
      <br>
      <button onclick="playNarracao(); nextQuestion(0)">Começar</button>
    </div>

    <div id="questions-container"></div>

    <div class="card hidden" id="certificate">
      <img src="/home/gilmar/Downloads/CEIAB_image.png" alt="CEIAB Logo" class="top-logo">
      <h2>Parabéns!</h2>
      <img src="https://cdn-icons-png.flaticon.com/512/4208/4208429.png" alt="Medalha" class="question-image">
      <p>Você completou a jornada e agora é um Guardião do Cuidado! 🏅</p>
      <input type="text" placeholder="Digite seu nome" id="name-input">
      <button onclick="generateCertificate()">Gerar Certificado</button>
      <p id="cert-text" class="hidden"></p>
    </div>
  </div>

  <script>
    const questions = [
      ["Você ganhou um prêmio num link estranho. O que fazer?", "Perguntar para um adulto", "Clicar no link", "https://cdn-icons-png.flaticon.com/512/1048/1048940.png"],
      ["Alguém desconhecido falou com você no joguinho. O que fazer?", "Sair do jogo e avisar um adulto", "Conversar com a pessoa", "https://cdn-icons-png.flaticon.com/512/1048/1048977.png"],
      ["Você viu um vídeo estranho na internet. O que fazer?", "Contar para a professora ou responsável", "Assistir escondido", "https://cdn-icons-png.flaticon.com/512/3135/3135715.png"],
      ["Seu amigo pediu sua senha. O que você faz?", "Não contar", "Contar porque é amigo", "https://cdn-icons-png.flaticon.com/512/4202/4202843.png"],
      ["Um site pediu seu nome e endereço. Você:", "Conta para um adulto", "Preenche sem pensar", "https://cdn-icons-png.flaticon.com/512/747/747376.png"],
      ["Quer baixar um novo joguinho. Você:", "Pede ajuda para um adulto", "Baixa sozinho", "https://cdn-icons-png.flaticon.com/512/1048/1048929.png"],
      ["Recebeu mensagem de um estranho. Você:", "Ignora e avisa um adulto", "Responde para fazer amizade", "https://cdn-icons-png.flaticon.com/512/1057/1057084.png"],
      ["Seu tablet travou. Você:", "Chama um adulto", "Clica em todos os botões", "https://cdn-icons-png.flaticon.com/512/2709/2709689.png"],
      ["Alguém pede uma foto sua. Você:", "Diz não e avisa um adulto", "Manda sem contar para ninguém", "https://cdn-icons-png.flaticon.com/512/3188/3188471.png"],
      ["Viu algo estranho na internet. Você:", "Conta para um adulto", "Fica curioso e continua", "https://cdn-icons-png.flaticon.com/512/2847/2847555.png"],
      ["Quer conversar online. Você fala com:", "Pessoas que conhece pessoalmente", "Qualquer um", "https://cdn-icons-png.flaticon.com/512/2921/2921826.png"],
      ["Seu colega mostra um site novo. Você:", "Pergunta para um adulto", "Acessa escondido", "https://cdn-icons-png.flaticon.com/512/2921/2921801.png"],
      ["Quer criar uma senha. Você faz:", "Senha secreta e difícil", "Senha fácil, tipo 1234", "https://cdn-icons-png.flaticon.com/512/456/456212.png"],
      ["Encontrou algo que te assustou. Você:", "Conta para um adulto", "Guarda segredo", "https://cdn-icons-png.flaticon.com/512/4202/4202849.png"],
      ["Pediu ajuda mas ninguém ouviu. Você:", "Procura outro adulto", "Desiste e continua sozinho", "https://cdn-icons-png.flaticon.com/512/4775/4775459.png"]
    ];

    const container = document.getElementById('questions-container');

    function buildQuestions() {
      questions.forEach((q, index) => {
        container.innerHTML += `
          <div class="card hidden" id="question${index}">
            <img src="/home/gilmar/Downloads/CEIAB_image.png" alt="CEIAB Logo" class="top-logo">
            <h2>Desafio ${index + 1}</h2>
            <img src="${q[3]}" class="question-image" alt="Imagem relacionada">
            <p>${q[0]}</p>
            <button onclick="showFeedback(${index}, true)">✔ ${q[1]}</button>
            <button onclick="showFeedback(${index}, false)">✘ ${q[2]}</button>
          </div>
          <div class="card hidden" id="feedback${index}">
            <img src="/home/gilmar/Downloads/CEIAB_image.png" alt="CEIAB Logo" class="top-logo">
            <h2 id="feedback-text${index}"></h2>
            <button onclick="nextQuestion(${index + 1})">${index + 1 < questions.length ? "Próximo desafio" : "Finalizar"}</button>
          </div>
        `;
      });
    }

    function playNarracao() {
      document.getElementById('narracao').play();
    }

    function nextQuestion(index) {
      document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
      if (index < questions.length) {
        document.getElementById('question' + index).classList.remove('hidden');
      } else {
        document.getElementById('certificate').classList.remove('hidden');
      }
    }

    function showFeedback(index, correct) {
      document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
      document.getElementById('feedback' + index).classList.remove('hidden');
      document.getElementById('feedback-text' + index).textContent = correct
        ? "Muito bem! Você está seguro!"
        : "Cuidado! Melhor pedir ajuda a um adulto!";
    }

    function generateCertificate() {
      const name = document.getElementById('name-input').value.trim();
      const certText = document.getElementById('cert-text');
      if (name) {
        certText.textContent = `Certificado: ${name} é um Guardião Oficial do Cuidado! 🎉`;
        certText.classList.remove('hidden');
      }
    }

    buildQuestions();
  </script>
</body>
</html>
